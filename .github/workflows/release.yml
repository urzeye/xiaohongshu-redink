name: Build and Release Desktop

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop:
    uses: ./.github/workflows/desktop-release.yml

  release:
    needs: build-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Desktop Installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: build-artifacts
          merge-multiple: true

      - name: Verify Installers and Prepare Release Notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          find build-artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -exec cp {} release-assets/ \;
          VERSION="${GITHUB_REF_NAME#v}"
          test -f "release-assets/RedInk_${VERSION}_x64-setup.exe"
          test -f "release-assets/RedInk_${VERSION}_x64_en-US.msi"
          test -f "release-assets/RedInk_${VERSION}_universal.dmg"

          cat > release-notes.md <<'NOTES'
          ## RedInk 桌面客户端

          - Windows：下载 `.exe` 或 `.msi` 安装包。
          - macOS：下载 `.dmg`，支持 Apple Silicon 和 Intel。
          - 发布进程在本地运行；本地运行不构成账号免风控保证。

          当前版本仍依赖本地 Python 后端、Python 依赖和发布工具，安装包尚未内置这些运行资源。使用前请按仓库文档准备源码运行环境，并通过 `REDINK_ROOT` 指向项目目录。

          Docker 配置继续保留，镜像改为按需手动发布，不随版本自动构建或推送。

          ### 本次更新

          NOTES
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [[ -n "$PREV_TAG" ]]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' >> release-notes.md
          else
            git log -n 10 --pretty=format:'- %s' >> release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RedInk Desktop ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-assets/*.exe
            release-assets/*.msi
            release-assets/*.dmg
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
