name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Release Notes
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<'NOTES'
          ## RedInk · 小红书 AI 爆款创作与本地安全发布引擎

          ### 🚀 运行方式
          - **本地 Web 模式**：通过一键启动脚本（Windows: `start.bat`，macOS/Linux: `start.sh`）或源码启动；
          - **Docker 容器化**：支持 Docker & Docker Compose 一键启动；
          - **家庭宽带发布**：支持在创作者本地网络运行，规避云端 IP 风控。

          ### 📝 本次更新内容
          NOTES

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [[ -n "$PREV_TAG" ]]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' >> release-notes.md
          else
            git log -n 10 --pretty=format:'- %s' >> release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RedInk ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
