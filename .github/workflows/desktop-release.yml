name: Build Desktop Installers

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-tauri:
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: "macos-latest"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin --bundles dmg"
            artifact: macos
          - platform: "windows-latest"
            rust-targets: "x86_64-pc-windows-msvc"
            args: "--bundles nsis,msi"
            artifact: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.rust-targets }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --dir frontend install --frozen-lockfile

      - name: Build Desktop Installers
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
          retryAttempts: 0

      - name: Upload Desktop Installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
