name: Build Cross-Platform Desktop (Tauri)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "universal-apple-darwin"
            args: "--target universal-apple-darwin"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: |
          pnpm install
          pnpm --dir frontend install

      - name: Build Desktop Application (Tauri Action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "RedInk Desktop ${{ github.ref_name }}"
          releaseBody: |
            ### 🖥️ RedInk 跨平台桌面客户端已发布！

            为避免小红书账号风控，本桌面客户端运行于用户**本地家庭宽带环境**，无黑框、免配置 Docker / Node.js。

            - **Windows 用户**: 下载 `.exe` 安装程序或压缩包解压直接运行
            - **macOS 用户**: 下载 `.dmg` 文件拖入 Applications 即可使用（通用架构支持 M 系列芯片与 Intel）
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
